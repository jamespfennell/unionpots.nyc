# One workflow for the whole repository: it builds and pushes both images,
# the website (unionpots.nyc) and the log (log.unionpots.nyc, also the demo).
# The rollout deploys when a workflow run finishes, so a single run that only
# finishes once both images are pushed means it never pulls a stale one.
name: CI

on:
  push:
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: jamespfennell
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the Docker image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: jamespfennell/unionpots.nyc:latest
          # Only push to Docker Hub if this is a push to main
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: log/go.mod
          cache-dependency-path: log/go.sum

      - name: Test
        working-directory: log
        run: go vet ./... && go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: jamespfennell
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record the build time
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build the Docker image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: log
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: jamespfennell/log.unionpots.nyc:latest
          # Only push to Docker Hub if this is a push to main
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
