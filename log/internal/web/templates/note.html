{{define "content"}}
{{$n := .Note}}
<h1>{{$n.Title}}</h1>
<p class="part-of"><a href="/notes">All notes</a></p>

<section>
  <h2>Note <span class="save-status" data-save-status aria-live="polite"></span></h2>
  <form method="post" action="/notes/{{$n.ID}}" class="stack" data-autosave
        hx-post="/notes/{{$n.ID}}" hx-trigger="input delay:600ms, change, submit" hx-swap="none">
    <input type="hidden" name="autosave" value="1">
    <label class="field">Title <input name="title" value="{{$n.Title}}" required autocomplete="off"></label>
    <label class="field">Text <textarea class="note-text" autocomplete="off" name="text" rows="10">{{$n.Text}}</textarea></label>
  </form>
</section>

<form method="post" action="/notes/{{$n.ID}}/delete" class="stack" hx-confirm="Delete this note?">
  <button class="button danger" type="submit">Delete note</button>
</form>
{{end}}
