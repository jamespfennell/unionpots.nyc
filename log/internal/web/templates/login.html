{{define "content"}}
<div class="login">
  <h1>Union Pots · Log</h1>
  <form method="post" action="/login" class="stack" hx-boost="false">
    <input type="hidden" name="next" value="{{.Next}}">
    {{with .Notice}}<p class="notice" role="status">{{.}}</p>{{end}}
    {{with .Message}}<p class="login-message">{{.}}</p>{{end}}
    <label class="field">Password
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    {{with .Error}}<p class="error">{{.}}</p>{{end}}
    <button class="button primary block" type="submit">Log in</button>
  </form>
  {{with .Version}}<p class="login-version">Version {{.}}</p>{{end}}
</div>
{{end}}
