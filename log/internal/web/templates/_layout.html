{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Log">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}],"scrollIntoViewOnBoost":false}'>
  <title>{{.Title}} · Union Pots log</title>
  <link rel="manifest" href="{{static "manifest.webmanifest"}}">
  <link rel="icon" href="{{static "icon.svg"}}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{static "app.css"}}">
  <script src="{{static "htmx.min.js"}}" defer></script>
  <script src="{{static "app.js"}}" defer></script>
</head>
<body hx-boost="true">
  {{if .Banner}}<div class="banner" role="status">{{.Banner}}</div>{{end}}
  {{if .LoggedIn}}
  <header class="top">
    <a class="brand" href="/">Union Pots · Log</a>
    <nav>
      <a class="nav-link" href="/new">+ New</a>
    </nav>
  </header>
  {{end}}
  <main>
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
